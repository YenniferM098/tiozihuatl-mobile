import groovy.json.JsonSlurper

apply plugin: 'com.android.application'

// Versión de la app: versionName se toma de package.json (se actualiza en cada rama release/*)
// y versionCode se recibe en el pipeline con -PversionCode=<número de ejecución>; en local vale 1.
def paqueteNpm = new JsonSlurper().parse(file('../../package.json'))
def codigoVersion = (project.findProperty('versionCode') ?: '1').toString().toInteger()

// Firma de release: se lee de android/keystore.properties (equipo local, fuera de git)
// o de variables de entorno (GitHub Actions, a partir de los secretos del environment produccion).
def propiedadesFirma = new Properties()
def archivoFirma = rootProject.file('keystore.properties')
if (archivoFirma.exists()) {
    archivoFirma.withInputStream { propiedadesFirma.load(it) }
}
def valorFirma = { String clave, String variable ->
    propiedadesFirma.getProperty(clave) ?: System.getenv(variable)
}

android {
    namespace = "com.tiozihuatl.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.tiozihuatl.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode codigoVersion
        versionName paqueteNpm.version
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            def rutaKeystore = valorFirma('storeFile', 'ANDROID_KEYSTORE_PATH')
            if (rutaKeystore) {
                storeFile rootProject.file(rutaKeystore)
                storePassword valorFirma('storePassword', 'ANDROID_KEYSTORE_PASSWORD')
                keyAlias valorFirma('keyAlias', 'ANDROID_KEY_ALIAS')
                keyPassword valorFirma('keyPassword', 'ANDROID_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            // Sin llave configurada el build release queda sin firmar (Play lo rechaza).
            if (signingConfigs.release.storeFile != null) {
                signingConfig signingConfigs.release
            }
            // R8 ofusca y reduce el código Java/Kotlin, y elimina los recursos que no se usan.
            // El archivo de desofuscación queda en build/outputs/mapping/release/mapping.txt.
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
