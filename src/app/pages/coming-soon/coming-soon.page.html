<ion-header>
  <ion-toolbar>
    <ion-title>{{ data.title }}</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <section class="coming-soon">
    <div class="coming-soon__badge">
      <i class="ph ph-{{ data.icon }}" aria-hidden="true"></i>
    </div>
    <h2 class="coming-soon__title">Próximamente</h2>
    <p class="coming-soon__text">{{ data.description }}</p>
  </section>
</ion-content>
