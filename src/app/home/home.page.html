<ion-header>
  <ion-toolbar>
    <ion-title>Tiozihuatl</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="logout()" aria-label="Cerrar sesión">
        <ion-icon slot="icon-only" name="log-out-outline"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  @if (user(); as u) {
    <div id="container">
      <strong>Hola, {{ u.nombre || u.correo }}</strong>
      <p>Sesión iniciada como <b>{{ u.rol }}</b></p>
    </div>
  }
</ion-content>
